global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: together-account-backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ['backend:3001']
        labels:
          service: together-account-api

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
